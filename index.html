<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قفسه آرا | تجهیزات فروشگاهی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--red:#e10600;--red2:#ff3b30;--ink:#16161a;--mut:#6b6b76;--bg:#fff;--soft:#fff5f4;--line:#f0e2e0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:80px}
*{box-sizing:border-box;margin:0}
body{font-family:'Vazirmatn',Tahoma,sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden;line-height:1.8}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.85);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:10px 5vw}
.brand{font-weight:900;font-size:1.5rem;letter-spacing:-.5px}.brand b{color:var(--red)}
nav{display:flex;gap:6px}nav a{color:var(--ink);text-decoration:none;font-weight:600;font-size:.92rem;padding:6px 14px;border-radius:99px;transition:.3s}nav a:hover{background:var(--red);color:#fff}
.hero{position:relative;text-align:center;padding:40px 5vw 70px;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.35;animation:fl 9s ease-in-out infinite;z-index:0}
.b1{width:340px;height:340px;background:var(--red);top:-80px;right:-80px}.b2{width:260px;height:260px;background:#ff8a80;bottom:-60px;left:-40px;animation-delay:-4s}
@keyframes fl{50%{transform:translate(30px,-30px) scale(1.12)}}
.hero>*{position:relative;z-index:1}
.logo{width:min(300px,70vw);border-radius:28px;box-shadow:0 20px 60px rgba(225,6,0,.18);animation:pop 1s cubic-bezier(.2,.9,.3,1.2) both,bob 5s ease-in-out 1s infinite}
@keyframes pop{from{opacity:0;transform:scale(.6) translateY(30px)}}@keyframes bob{50%{transform:translateY(-10px)}}
h1{font-weight:900;font-size:clamp(2rem,6vw,3.6rem);line-height:1.3;margin:26px 0 10px;animation:up .9s .3s both}
h1 span{background:linear-gradient(90deg,var(--red),var(--red2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);max-width:560px;margin:0 auto 26px;animation:up .9s .45s both}
@keyframes up{from{opacity:0;transform:translateY(24px)}}
.btn{display:inline-block;border:0;cursor:pointer;font-family:inherit;font-weight:800;font-size:.95rem;padding:12px 28px;border-radius:99px;text-decoration:none;transition:.3s;margin:4px}
.pri{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;box-shadow:0 10px 26px rgba(225,6,0,.35)}.pri:hover{transform:translateY(-3px);box-shadow:0 16px 34px rgba(225,6,0,.45)}
.sec{background:#fff;color:var(--red);border:2px solid var(--red)}.sec:hover{background:var(--red);color:#fff;transform:translateY(-3px)}
section{padding:60px 5vw;max-width:1250px;margin:auto}
.ttl{font-weight:900;font-size:clamp(1.5rem,4vw,2.2rem);text-align:center}.ttl:after{content:"";display:block;width:60px;height:5px;border-radius:9px;background:var(--red);margin:8px auto 28px}
.tools{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:30px}
.chip{color:var(--ink);border:1.5px solid var(--line);background:#fff;padding:7px 18px;border-radius:99px;cursor:pointer;font-family:inherit;font-weight:600;transition:.25s}.chip:hover{border-color:var(--red)}.chip.on{background:var(--red)!important;color:#fff!important;border-color:var(--red)}
.srch{color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:99px;padding:8px 18px;font-family:inherit;min-width:200px;outline:0;transition:.3s}.srch:focus{border-color:var(--red);box-shadow:0 0 0 4px rgba(225,6,0,.1)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:24px}
.card{background:#fff;border:1px solid var(--line);border-radius:24px;overflow:hidden;transition:.4s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-8px);box-shadow:0 24px 50px rgba(225,6,0,.15);border-color:#ffb4ae}
.img{aspect-ratio:1/1;background:linear-gradient(135deg,var(--soft),#fff);display:grid;place-items:center;overflow:hidden;position:relative}
.img img{width:100%;height:100%;object-fit:cover;transition:.6s}.card:hover .img img{transform:scale(1.08)}
.img svg{width:45%;opacity:.5}
.tag{position:absolute;top:12px;right:12px;background:var(--red);color:#fff;font-size:.72rem;font-weight:700;padding:2px 12px;border-radius:99px}
.cb{padding:16px 18px 20px;display:flex;flex-direction:column;gap:6px;flex:1}
.cb h3{font-weight:800;font-size:1.05rem}.cb p{color:var(--mut);font-size:.86rem;flex:1}
.pr{background:var(--soft);color:var(--red);font-weight:700;font-size:.82rem;padding:8px 12px;border-radius:12px;text-align:center}
.cb .btn{margin:6px 0 0;padding:10px;text-align:center}
.empty{text-align:center;color:var(--mut);grid-column:1/-1;padding:40px}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.ic{background:var(--soft);border-radius:24px;padding:26px;text-align:center;transition:.35s}.ic:hover{transform:translateY(-6px);background:var(--red);color:#fff}.ic:hover a{color:#fff}
.ic .e{font-size:2rem}.ic h4{font-weight:800;margin:4px 0}.ic a{color:var(--red);font-weight:700;text-decoration:none;word-break:break-all}.ic .m{opacity:.55}
footer{text-align:center;padding:28px;color:var(--mut);font-size:.85rem;border-top:1px solid var(--line)}
.rv{opacity:0;transform:translateY(30px);transition:.8s cubic-bezier(.2,.8,.2,1)}.rv.in{opacity:1;transform:none}
#fab{display:none;position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:20px;z-index:30;background:var(--ink);color:#fff;border:0;border-radius:99px;padding:12px 22px;font:800 .9rem inherit;font-family:inherit;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.3);transition:.3s}#fab:hover{background:var(--red)}
#adm{display:none;position:fixed;inset:0;z-index:50;background:rgba(20,10,10,.55);backdrop-filter:blur(6px);padding:3vh 3vw;overflow:auto}
.pan{background:#fff;border-radius:26px;max-width:900px;margin:auto;padding:24px;animation:pop .5s both}
.pan h2{font-weight:900;margin-bottom:12px}.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.pan label{display:block;font-weight:600;font-size:.85rem;margin:10px 0 3px}
.pan input,.pan textarea,.pan select{color:var(--ink);background:#fff;width:100%;border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;font-family:inherit;outline:0}
.pan input:focus,.pan textarea:focus,.pan select:focus{border-color:var(--red)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}@media(max-width:600px){.two{grid-template-columns:1fr}nav{display:none}}
.row{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--line);border-radius:14px;margin:6px 0}
.row img,.row i{width:46px;height:46px;border-radius:10px;object-fit:cover;background:var(--soft);flex:none}.row span{flex:1;font-weight:600}
.sm{padding:6px 14px;font-size:.8rem}.dng{background:#fff;color:#c00;border:2px solid #c00}.dng:hover{background:#c00;color:#fff}
#tst{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 24px;border-radius:99px;z-index:99;opacity:0;transition:.4s;pointer-events:none}#tst.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>
</head>

<script>
const SRC='<!DOCTYPE html>'+document.documentElement.outerHTML;
let D=JSON.parse(document.getElementById('data').textContent),A,cat='همه',q='',pimg='',editId=null,tab='p';
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dg=s=>String(s).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/\D/g,'');
function link(t,v){if(!v)return'';if(/^https?:/.test(v))return v;if(t=='wa')return'https://wa.me/'+dg(v).replace(/^0/,'98');if(t=='ig')return'https://instagram.com/'+v.replace('@','');return'tel:'+dg(v)}
const PH='<svg viewBox="0 0 64 64" fill="none" stroke="#e10600" stroke-width="3"><path d="M8 10h48M8 26h48M8 42h48M8 58h48M12 10v48M52 10v48"/></svg>';
function site(){const s=D.settings;$('#logo').src=s.logo;$('#ht').innerHTML=s.heroTitle;$('#hs').textContent=s.heroSub;
const all=['همه',...D.cats];$('#chips').innerHTML=all.map(c=>`<button class="chip ${c==cat?'on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('')+'<input class="srch" id="sq" placeholder="جستجوی محصول..." value="'+esc(q)+'">';
$('#chips').onclick=e=>{if(e.target.dataset.c){cat=e.target.dataset.c;site();$('#sq').focus()}};
$('#sq').oninput=e=>{q=e.target.value;grid()};grid();
const w=link('wa',s.whatsapp),ig=link('ig',s.instagram),it=(e,t,v,h)=>`<div class="ic rv"><div class="e">${e}</div><h4>${t}</h4>${v?(h?`<a href="${esc(h)}" target="_blank" rel="noopener">${esc(v)}</a>`:`<span>${esc(v)}</span>`):'<span class="m">به‌زودی</span>'}</div>`;
$('#info').innerHTML=it('🕘','ساعت کاری',s.hours)+it('📞','تلفن تماس',s.phone,link('t',s.phone))+it('📸','اینستاگرام',s.instagram,ig)+it('💬','واتساپ',s.whatsapp,w)+it('📍','آدرس',s.address);
$('#ft').textContent='© '+s.name+' — همه حقوق محفوظ است';obs()}
function grid(){const s=D.settings,l=D.products.filter(p=>(cat=='همه'||p.cat==cat)&&(!q||(p.name+p.desc).includes(q)));
const h=link('wa',s.whatsapp)||link('t',s.phone);
$('#grid').innerHTML=l.length?l.map((p,i)=>`<div class="card rv" style="transition-delay:${i%4*80}ms"><div class="img">${p.img?`<img src="${p.img}" alt="${esc(p.name)}" loading="lazy">`:PH}<span class="tag">${esc(p.cat)}</span></div><div class="cb"><h3>${esc(p.name)}</h3><p>${esc(p.desc)}</p><div class="pr">تماس بگیرید جهت استعلام قیمت</div><a class="btn pri" href="${esc(h)}" target="_blank" rel="noopener">استعلام قیمت</a></div></div>`).join(''):'<div class="empty">محصولی پیدا نشد.</div>';obs()}
function obs(){const o=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');o.unobserve(e.target)}}),{threshold:.1});document.querySelectorAll('.rv:not(.in)').forEach(n=>o.observe(n))}
function toast(t){const n=$('#tst');n.textContent=t;n.classList.add('on');setTimeout(()=>n.classList.remove('on'),2800)}
/* ---- admin (visible only to the page owner/editors) ---- */
function pan(){const s=A.settings,f=(k,l)=>`<div><label>${l}</label><input data-s="${k}" value="${esc(s[k])}"></div>`;
let b;
if(tab=='p'){const e=A.products.find(p=>p.id==editId)||{};b=`<h3>${editId?'ویرایش محصول':'افزودن محصول جدید'}</h3><div class="two"><div><label>نام محصول</label><input id="pn" value="${esc(e.name)}"></div><div><label>دسته‌بندی</label><select id="pc">${A.cats.map(c=>`<option ${c==e.cat?'selected':''}>${esc(c)}</option>`).join('')}</select></div></div><label>توضیحات</label><textarea id="pd" rows="3">${esc(e.desc)}</textarea><label>عکس محصول</label><input type="file" id="pf" accept="image/*">${pimg?`<img src="${pimg}" style="width:90px;border-radius:12px;margin-top:8px">`:''}<div style="margin-top:12px"><button class="btn pri sm" id="ps">${editId?'ثبت تغییرات':'افزودن به لیست'}</button>${editId?'<button class="btn sec sm" id="pcx">انصراف</button>':''}</div><h3 style="margin-top:20px">لیست محصولات (${A.products.length})</h3>`+A.products.map(p=>`<div class="row">${p.img?`<img src="${p.img}">`:'<i></i>'}<span>${esc(p.name)}</span><button class="btn sec sm" data-e="${p.id}">ویرایش</button><button class="btn dng sm" data-d="${p.id}">حذف</button></div>`).join('')}
else b=`<div class="two">${f('name','نام فروشگاه')}${f('hours','ساعت کاری')}${f('phone','شماره تماس')}${f('instagram','لینک یا آیدی اینستاگرام')}${f('whatsapp','شماره یا لینک واتساپ')}${f('address','آدرس')}${f('pass','رمز ورود به پنل (برای نسخه زیپ)')}${f('heroTitle','عنوان بالای صفحه (HTML مجاز)')}${f('heroSub','متن زیر عنوان')}</div><label>دسته‌بندی‌ها (با کاما جدا کن)</label><input id="cs" value="${esc(A.cats.join('، '))}">`;
$('#pan').innerHTML=`<h2>⚙️ پنل مدیریت قفسه آرا</h2><div class="tabs"><button class="chip ${tab=='p'?'on':''}" data-t="p">محصولات</button><button class="chip ${tab=='s'?'on':''}" data-t="s">اطلاعات سایت</button></div>${b}<hr style="margin:20px 0;border:0;border-top:1px solid #eee"><button class="btn pri" id="pub">💾 ذخیره و انتشار</button><button class="btn sec" id="cl">بستن</button>`}
$('#pan').onclick=async e=>{const t=e.target,d=t.dataset;
if(d.t){tab=d.t;pan()}else if(d.e){editId=d.e;pimg=A.products.find(p=>p.id==editId).img;pan()}
else if(d.d){if(confirm('این محصول حذف شود؟')){A.products=A.products.filter(p=>p.id!=d.d);pan()}}
else if(t.id=='pcx'){editId=null;pimg='';pan()}
else if(t.id=='ps'){const n=$('#pn').value.trim();if(!n)return toast('نام محصول را وارد کن');const o={id:editId||String(Date.now()),name:n,cat:$('#pc').value,desc:$('#pd').value,img:pimg};
editId?A.products=A.products.map(p=>p.id==editId?o:p):A.products.unshift(o);editId=null;pimg='';pan();toast('به لیست اضافه شد؛ برای نمایش روی سایت «ذخیره و انتشار» بزن')}
else if(t.id=='cl'){$('#adm').style.display='none'}
else if(t.id=='pub'){const c=$('#cs');if(c)A.cats=c.value.split(/[,،\n]/).map(x=>x.trim()).filter(Boolean);
let a=null;try{a=window.claude&&await claude.use('artifact')}catch(x){}
try{const doc=new DOMParser().parseFromString(SRC,'text/html');doc.getElementById('data').textContent=JSON.stringify(A).replace(/</g,'\\u003c');const out='<!DOCTYPE html>'+doc.documentElement.outerHTML;
if(a){t.textContent='در حال انتشار...';await a.publish(out)}else{const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([out],{type:'text/html'}));l.download='index.html';l.click();toast('فایل جدید index.html دانلود شد؛ جای فایل قبلی روی هاستت بذار')}}catch(x){t.textContent='💾 ذخیره';toast('خطا: '+(x&&x.message||x))}}};
$('#pan').oninput=e=>{if(e.target.dataset.s)A.settings[e.target.dataset.s]=e.target.value};
$('#pan').onchange=e=>{if(e.target.id!='pf'||!e.target.files[0])return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,700/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);pimg=c.toDataURL('image/jpeg',.78);const n=$('#pn').value,d=$('#pd').value,cc=$('#pc').value;pan();$('#pn').value=n;$('#pd').value=d;$('#pc').value=cc};i.src=r.result};r.readAsDataURL(e.target.files[0])};
$('#fab').onclick=()=>{A=JSON.parse(JSON.stringify(D));editId=null;pimg='';tab='p';pan();$('#adm').style.display='block'};
site();
(async()=>{try{if(!window.claude||!claude.use)return;const u=await claude.use('user'),a=await claude.use('artifact');if(u&&a&&u.canEdit())$('#fab').style.display='block'}catch(e){}})();
if(location.hash=='#admin'){const p=prompt('رمز پنل مدیریت:');if(p!==null&&p===(D.settings.pass||'1234'))$('#fab').click();else if(p!==null)alert('رمز اشتباه است')}
</script>
</body>
</html>
